# ========================================================
# Nginx Configuration for vista-thepark.irunda.co.kr
# 이룬다 공인중개사사무소 (irunda.co.kr)
# ========================================================

# 1. HTTP -> HTTPS 자동 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name vista-thepark.irunda.co.kr vista-thepark.iruna.co.kr;

    # Let's Encrypt SSL 인증서 갱신 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 메인 서비스 프록시
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vista-thepark.irunda.co.kr vista-thepark.iruna.co.kr;

    # SSL 인증서 경로 (Let's Encrypt certbot 설치 시 자동 생성)
    ssl_certificate /etc/letsencrypt/live/vista-thepark.irunda.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vista-thepark.irunda.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json image/svg+xml;

    # 정적 파일 캐싱 (이미지, 폰트)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 백엔드 Node.js 서버 프록시
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
